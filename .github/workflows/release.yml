# Publier une version : git tag v1.2.3 && git push origin v1.2.3
# Les PG Companion déjà installés la téléchargent à leur prochain démarrage.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Version
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag attendu : vX.Y.Z"; exit 1; }
          echo "VERSION = \"${GITHUB_REF_NAME#v}\"" > version.py
      - run: python -m pip install -r requirements-build.txt
      - run: python -m pytest -q
      - name: Build
        # winrt : modules de l'OCR de Windows, chargés dynamiquement par winocr
        run: >
          python -m PyInstaller server.py --name PGCompanion --onefile --console --noconfirm --clean
          --add-data "static;static"
          --collect-all winrt --collect-all winocr --hidden-import qrcode
          --exclude-module tkinter --exclude-module numpy --exclude-module cv2 --exclude-module dxcam
      - name: Checksum
        shell: bash
        working-directory: dist
        run: sha256sum PGCompanion.exe > PGCompanion.exe.sha256
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/PGCompanion.exe dist/PGCompanion.exe.sha256
          --title "PG Companion ${GITHUB_REF_NAME#v}" --generate-notes
